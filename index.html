표본 편향, 실험 또는 준실험 설계 필요.", "workflow": "목표·역할·자료 범위 → 프롬프트 작성 → AI 출력의 사실/계산/출처 검증 → 수정 프롬프트 → 최종 인간 판단"}, {"id": "a10", "type": "AI 협업형", "title": "소상공인 자금지원 제안서", "task": "AI 초안의 효과를 검토한 다음 건전성·형평성·실행비용을 반영해 사업 우선순위를 다시 제안하라.", "guide": "지표·대상·예산·부실위험·사후 평가 포함.", "workflow": "목표·역할·자료 범위 → 프롬프트 작성 → AI 출력의 사실/계산/출처 검증 → 수정 프롬프트 → 최종 인간 판단"}, {"id": "a11", "type": "AI 활용형", "title": "IFRS 9 ECL 설명자료", "task": "비전문 동료에게 ECL Stage 1/2/3 차이를 설명하도록 AI 지시문을 작성하고 사례로 검증하라.", "guide": "정의 검증, 12개월 ECL과 전체기간 ECL 구분, Stage3 신용손상.", "workflow": "목표·역할·자료 범위 → 프롬프트 작성 → AI 출력의 사실/계산/출처 검증 → 수정 프롬프트 → 최종 인간 판단"}, {"id": "a12", "type": "AI 검증형", "title": "개인정보 노출된 분석보고서", "task": "AI 결과에 실제 고객명·주민등록번호·계좌번호가 포함됐다. 과제 결과 제출 전에 어떻게 처리할 것인가?", "guide": "민감정보 재노출 중단, 비식별화, 승인된 도구 여부 확인, 내부 보고.", "workflow": "목표·역할·자료 범위 → 프롬프트 작성 → AI 출력의 사실/계산/출처 검증 → 수정 프롬프트 → 최종 인간 판단"}, {"id": "a13", "type": "AI 협업형", "title": "여신 심사 반대 관점 도출", "task": "AI가 승인 의견을 제시했다. 반대 의견과 보완조건, 보고용 최종 의견을 단계적으로 도출하라.", "guide": "반증요구, 데이터 공백, 스트레스 시나리오, 조건부 승인 또는 보류 논리.", "workflow": "목표·역할·자료 범위 → 프롬프트 작성 → AI 출력의 사실/계산/출처 검증 → 수정 프롬프트 → 최종 인간 판단"}, {"id": "a14", "type": "AI 활용형", "title": "그룹토론 근거표 작성", "task": "우선순위 선택지 8개에 대해 고객효과·비용·위험 평가표를 AI에 작성시키되 근거 불명 항목을 구분하라.", "guide": "점수 기준과 증거를 분리하고 임의 숫자 생성 금지.", "workflow": "목표·역할·자료 범위 → 프롬프트 작성 → AI 출력의 사실/계산/출처 검증 → 수정 프롬프트 → 최종 인간 판단"}, {"id": "a15", "type": "AI 검증형", "title": "출처와 데이터 기준시점 혼동", "task": "AI가 서로 다른 연도의 은행 실적을 동일 기준으로 비교해 성장률을 산출했다.", "guide": "기간·연결/별도·회계정책·단위 확인 뒤 비교가능성 보정.", "workflow": "목표·역할·자료 범위 → 프롬프트 작성 → AI 출력의 사실/계산/출처 검증 → 수정 프롬프트 → 최종 인간 판단"}, {"id": "a16", "type": "AI 협업형", "title": "AI 결과를 팀에 설명하고 반론 수용", "task": "AI가 뽑은 정책 3개를 팀원에게 설명한 후 반대 의견을 반영해 2차 개선안을 제시하라.", "guide": "결과 신뢰구간·제약·대안·수정 이력·최종 책임.", "workflow": "목표·역할·자료 범위 → 프롬프트 작성 → AI 출력의 사실/계산/출처 검증 → 수정 프롬프트 → 최종 인간 판단"}, {"id": "a17", "type": "AI 검증형", "title": "잘못된 NIM 일반화", "task": "AI가 기준금리 인상은 무조건 은행 NIM을 개선한다고 결론냈다.", "guide": "자산/부채 리프라이싱, 조달경쟁, 예금 베타, 신용비용을 반영.", "workflow": "목표·역할·자료 범위 → 프롬프트 작성 → AI 출력의 사실/계산/출처 검증 → 수정 프롬프트 → 최종 인간 판단"}, {"id": "a18", "type": "AI 활용형", "title": "업종별 신용위험 시그널 정의", "task": "건설·제조·서비스 업종 각각의 위험 지표를 분리해 점검표 초안 생성.", "guide": "업종 특성·재무/비재무 정보·데이터 결측·인간 판단.", "workflow": "목표·역할·자료 범위 → 프롬프트 작성 → AI 출력의 사실/계산/출처 검증 → 수정 프롬프트 → 최종 인간 판단"}, {"id": "a19", "type": "AI 협업형", "title": "내부통제 개선안 공동작성", "task": "수기 결재 오류 12건이라는 가상 자료로 예방·탐지·사후대응 3단계 계획을 AI와 수립하라.", "guide": "업무 분리, 권한 관리, 이상 탐지, 감사 추적, 소유자 및 일정.", "workflow": "목표·역할·자료 범위 → 프롬프트 작성 → AI 출력의 사실/계산/출처 검증 → 수정 프롬프트 → 최종 인간 판단"}, {"id": "a20", "type": "AI 검증형", "title": "현금흐름 계산의 부호 오류", "task": "매출채권이 60억 증가했는데 AI가 이를 영업현금흐름 +60억 요인으로 처리했다.", "guide": "다른 조건 동일 시 매출채권 증가는 영업현금흐름 차감 조정 요인. 전체 현금흐름표 맥락 확인.", "workflow": "목표·역할·자료 범위 → 프롬프트 작성 → AI 출력의 사실/계산/출처 검증 → 수정 프롬프트 → 최종 인간 판단"}, {"id": "a21", "type": "AI 활용형", "title": "맥킨지형: 성장률 높은 기업의 진짜 문제 정의", "task": "가상 제조업체 매출 2024년 800억→2025년 1,000억→2026년 1,150억, 영업이익 64억→60억→46억, 매출채권 90억→165억→260억. 경영진은 성장투자를 위한 150억 대출을 요청했다. AI에 기업의 문제를 구조화하도록 지시하고, 3개 추가 질문과 여신심사 우선 검증항목을 도출하라.", "guide": "매출 증가와 이익률 하락을 분리해 계산(8%→6%→4%), 매출채권 증가율·회전기간을 검토. 문제 정의와 대출 승인 판단을 구분.", "workflow": "초기 가설 3개 → AI에 대립가설 요구 → 자료로 반박 → 중요 검증 질문 3개 → 보류/조건부 검토 결론"}, {"id": "a22", "type": "AI 협업형", "title": "맥킨지형: AI 초안을 세 차례 고쳐 최종 권고", "task": "가상 중견기업은 A사업(매출 600억, 영업이익률 8%, 성장률 3%)과 B사업(매출 250억, 영업이익률 -5%, 성장률 40%)을 운영한다. AI는 B의 높은 성장률만 보고 모든 투자금을 B에 배분하자고 권고했다. 초기 답을 비판하고 자료 요구→대안 시나리오→최종 신용심사 의견의 3회 프롬프트를 설계하라.", "guide": "규모·수익성·현금소진·투자회수 가능성 비교. B의 영업손실 약 12.5억 확인. 조건부 지원과 단계별 투자도 검토.", "workflow": "1차 사실표 → 2차 AI에게 자기 결론 반대 근거 생성 요청 → 3차 보완자료 부족 시 유보안을 포함한 실행권고"}, {"id": "a23", "type": "AI 활용형", "title": "베인형: 자료 3종으로 1페이지 제안서", "task": "가상 은행이 중소기업 고객의 디지털 대출 신청을 개선하려 한다. 고객 설문: 속도 45%, 금리 35%, 상담 20%; 처리 리드타임 평균 7일; 오류재제출 28%; 개발예산 8억. AI를 사용해 3개 개선안을 비용·효과·규제위험 기준으로 비교하고 임원에게 1페이지 제안서를 작성하라.", "guide": "속도 요구와 재제출 문제를 연결. 민감한 신용정보, 자동심사 설명가능성, 인간 심사 예외를 설계. 투자 회수는 자료 부족 시 산출 불가.", "workflow": "자료 정리 → 정책·보안 제약 명시 → 대안별 비교표 → 검증할 KPI → 실행 순서 및 발표"}, {"id": "a24", "type": "AI 검증형", "title": "베인형: AI가 만든 사업성 표의 계산 오류 검출", "task": "AI 분석표: 대출상품 가입자 20만명, 1인당 연간 기여이익 3만원, 운영비 15억원, 구축비 10억원. AI는 연간 기여이익 60억원, 첫해 순이익 45억원이라고 주장한다. 계산을 재검증하고 구축비를 포함한 첫해 손익을 계산하라.", "guide": "20만×3만원=60억원, 60-15-10=35억원. 구축비 회계처리는 자산인식 요건 및 상각기간에 따라 달라질 수 있어 손익 35억원도 단순 현금기준 예시임을 표시.", "workflow": "산식과 단위 확인 → 비용 분류 확인 → 대체 시나리오 → 회계상 제약과 최종 의견"}, {"id": "a25", "type": "AI 협업형", "title": "BCG형: AI와 함께 선택지를 줄인 뒤 90초 발표", "task": "은행 혁신과제 후보 5개: 챗봇 개선(비용 2억, 영향 60점), 신용분석 자동화(6억, 85점), 수기 결산 자동화(3억, 75점), 모바일 접근성(2억, 70점), 디지털자산 수탁(10억, 65점). 예산은 8억이다. AI로 가능한 조합을 탐색하되 점수의 의미가 불분명함을 지적하고, 추천안을 90초 스크립트로 완성하라.", "guide": "가능 조합 직접 검산. 3억+2억+2억=7억, 6억+2억=8억 등. 위험과 점수 산정의 출처를 구분하고 실행 가능성 평가.", "workflow": "조합 열거 요청 → AI 선택의 편향 점검 → 수익·위험·실행성 가중치 토론 → 최종 추천 발표"}, {"id": "a26", "type": "AI 검증형", "title": "KB형: 근거 없는 답변과 확신도 분리", "task": "내장 AI가 “2026년 모든 국내 은행은 생성형 AI가 작성한 기업여신보고서를 자동 승인할 수 있고, 담당자 검토 의무는 폐지됐다”라고 말한다. 제시된 자료에는 관련 법령 원문이 없다. 이 진술을 어떤 절차로 검증하고 어떻게 답안을 고칠지 작성하라.", "guide": "근거 문서 부재, 과도한 일반화, 자동 승인·책임소재 문제. 확인 전에는 법적 단정 금지. 정책 원문·시행일·내부규정과 검토 책임 확인.", "workflow": "사실·추정 분류 → 법률·내부규정 원문 확인 요청 → 인적 검토가 필요한 단계 구분 → 보수적 보고"}, {"id": "a27", "type": "AI 활용형", "title": "KB형: 문서 요약 후 자료 충돌 해소", "task": "가상 여신자료 A에는 2026년 매출 500억원, 자료 B에는 520억원, 고객 설명에는 550억원이라고 적혀 있다. AI에게 보고서를 작성하게 하되, 출처 충돌 표와 불일치 원인별 확인자료를 먼저 만들도록 프롬프트를 구성하라.", "guide": "기준일, 연결·별도, 잠정·감사, 부가세 포함 여부, 기간 차이 등을 질문. 하나를 임의로 선택하지 않음.", "workflow": "출처별 대조표 → 기준 정의 → 고객 확인질문 → 정합성 확인 이전에 확정 수치 사용 금지"}, {"id": "a28", "type": "AI 검증형", "title": "비판적 수리능력: 은행의 NIM 계산", "task": "가상 은행: 이자수익 240억원, 이자비용 150억원, 평균 이자수익자산 5,000억원. AI가 NIM을 4.8%라고 계산했다. 올바른 값을 구하고 오류 원인을 설명하라.", "guide": "순이자이익 90억원, NIM 90/5,000=1.8%. 4.8%는 이자수익만으로 계산한 수치. 연율화 여부·평균자산 기준 점검.", "workflow": "지표 정의 명시 → 수식 재계산 → 단위·기간 검증 → 수정 결론"}, {"id": "a29", "type": "AI 검증형", "title": "회계 전용: ECL 12개월과 전체기간 혼동", "task": "가상 대출 100억원, 12개월 PD 2%, LGD 40%, EAD 100억원. AI는 12개월 ECL을 8억원이라고 설명한다. 오류를 찾아 단순화한 올바른 값을 구하고 Stage 2로 옮겨갈 때 왜 같은 산식만 쓸 수 없는지 설명하라.", "guide": "단순화된 12개월 ECL=0.8억원(할인과 시점효과 무시). 8억원은 자릿수 오류. Stage 2는 전체기간의 기간별 PD·현금흐름·할인 반영 필요.", "workflow": "기초변수 단위 검산 → 회계모형의 제한 명시 → Stage 판정 및 전향정보 추가"}, {"id": "a30", "type": "AI 협업형", "title": "회계 전용: 공정가치 회계 판단의 예외 찾기", "task": "가상 투자채권 장부금액 100억원, 현재 공정가치 94억원. AI가 모든 채권은 6억원의 손실을 즉시 당기손익에 반영한다고 했다. 상품분류에 따라 손익·OCI·손상 처리 차이를 표로 개선하라.", "guide": "FVTPL 공정가치변동 손익, FVOCI는 공정가치변동 OCI(손상 등 예외), AC는 일반적인 공정가치 변동 직접 인식 없음. 사업모형과 SPPI 검토.", "workflow": "분류 판단 질문 → 회계처리 비교표 → AI에게 누락 예외 요청 → 최종 검토자 확인"}, {"id": "a31", "type": "AI 활용형", "title": "AI에게 민감정보 없이 샘플 데이터 만들게 하기", "task": "기업여신 관련 AI 도구의 가능성을 시연해야 한다. 실제 고객명·계좌번호·비공개 심사자료를 사용할 수 없는 환경에서, 현실적인 가상 기업 데이터셋과 검증 가능한 분석질문 5개를 만들도록 지시하라.", "guide": "합성 데이터 명시, 실제 기업을 암시하지 않기, 항목 간 수학적 일관성 검사. 승인된 도구·내부 정책이 불분명하면 데이터 입력 중단.", "workflow": "정보 분류 → 합성 데이터 생성 → 수학적 유효성 검증 → 분석 실험 → 보안 준수 기록"}, {"id": "a32", "type": "AI 협업형", "title": "문서 생산: 심사위원 보고서 → 1분 발표 변환", "task": "기업의 자금조달 희망액 80억원, 담보평가액 100억원, 선순위권리 40억원, 전년도 EBITDA 18억원, 이자비용 9억원. 이 정보만으로 AI에게 한 페이지 보고서 작성과 1분 발표용 요약을 순차 요청하고, 승인 판단의 누락 정보를 표시하라.", "guide": "단순 담보여력 60억원(비용·할인 무시), 이자보상능력 등 추가 데이터 필요. EBITDA/이자비용=2배는 엄밀한 회계상 이자보상배율과 구분.", "workflow": "초안 생성 → 논리와 용어 검토 → 핵심 의사결정 3문장으로 압축 → 1분 발표"}, {"id": "a33", "type": "AI 검증형", "title": "그래프 착시와 통계 오류 검증", "task": "AI가 연체율 0.8%→1.2%를 “0.4% 증가”라고 썼고, 그래프는 y축을 0.75%에서 시작해 폭증처럼 보이게 만들었다. 숫자 표현과 시각화를 수정하고 금융소비자 관점의 전달문을 써라.", "guide": "0.4%포인트 증가, 상대 증가율은 50%. 축 절단의 오해 가능성을 설명하고 원자료·분모·기간 확인.", "workflow": "%와 %p 검산 → 축과 기준선 확인 → 공정한 시각화 제안 → 과장 없는 요약"}, {"id": "a34", "type": "AI 협업형", "title": "반론 생성: 회의에서 추천안 뒤집기", "task": "팀이 신용평가 AI 모델 도입을 추천했지만 반대자는 공정성·모형 리스크를 주장한다. AI에게 도입 찬성 근거, 반대 근거, 중재 조건을 차례로 도출하게 하고 최종 합의문을 작성하라.", "guide": "성능·설명가능성·차별 영향·재학습·모델 드리프트·사람의 이의제기 절차까지 포함. 합의는 조건부 파일럿과 점검 기준으로 구체화.", "workflow": "찬성안 → 강한 반론 → 통제조건 → 실험 KPI → 합의문"}, {"id": "a35", "type": "AI 활용형", "title": "정보탐색: 출처 신뢰도에 따른 뉴스 브리핑", "task": "가상 환경: 같은 금융규제 발표를 놓고 정부 보도자료는 “시행 2027.1”, 언론 기사 A는 “내년 시행”, 온라인 글은 “즉시 시행”이라 썼다. AI에게 기준 날짜·주장·원문 링크·불확실성을 표로 비교하게 하라.", "guide": "기준일 명시, 1차 원문 우선, 기사 게시일과 실제 시행일 구분, 원문 미확인 시 미검증 표시.", "workflow": "출처 분류 → 1차 출처 요청 → 상충 확인 → 확정·미확정 분리 → 대응 브리핑"}, {"id": "a36", "type": "AI 검증형", "title": "AI가 만들어 낸 조항·판례 발견", "task": "AI는 “K-IFRS 제1118호 제999항에 은행의 대출충당금 적립률 150% 의무가 있다”고 주장했다. 제공된 문서에 조항은 존재하지 않는다. 할루시네이션을 어떻게 찾아내고 정확히 어떤 검증자료를 요청할지 작성하라.", "guide": "실재하지 않는 조항, 표시·공시기준과 건전성 규제의 혼동. 공인 기준서 원문 및 감독규정에서 별개 확인.", "workflow": "정확한 조항 요청 → 원문 교차검증 → 영역 혼동 확인 → 근거 없는 인용 삭제"}, {"id": "a37", "type": "AI 협업형", "title": "실전 종합: AI를 활용한 대출 심사 의견 수정", "task": "가상 기업: 매출 300억→350억, 영업이익 20억→21억, 영업현금흐름 +25억→-10억, 단기차입금 40억→80억, 매출채권 30억→75억. AI 초안은 “매출 17% 성장, 안전한 차주”라고 결론. AI로 재계산·반론·추가자료를 묻고 120자 최종 신용검토 의견을 작성하라.", "guide": "매출성장 약 16.7%, 이익률 하락 6.67%→6%, 운전자본 압박·차입 증가. 즉시 승인 불가, 현금흐름·연체·거래처 검증.", "workflow": "핵심지표 계산 → AI 초안 오류 지정 → 추가자료·대안 요청 → 120자 판단 기록"}], "sources": [{"name": "2026 회계사 2차 합격자 특별채용 공고", "type": "공고", "url": "https://www.kofia.or.kr/brd/m_96/view.do?itm_seq_1=0&itm_seq_2=0&seq=42158", "note": "모집 직무·실무수습 배치·통합면접 3종·영상인터뷰"}, {"name": "2025 하반기 신한은행 최종합격자 후기", "type": "직접 후기", "url": "https://community.linkareer.com/pass-review/6108495", "note": "과제형 토의와 개인심층 꼬리질문·약 10분 경험"}, {"name": "2025 상반기 리더십전형 후기", "type": "직접 후기", "url": "https://community.linkareer.com/pass-review/4847202", "note": "상품 우선순위·설득, 개별 심층 경험 검증"}, {"name": "2026 하반기 통합면접 분석", "type": "학원 분석", "url": "https://www.topbanker-ai.co.kr/board/224464684265-shinhan-2026-ai", "note": "전형 개편·그룹 과제 흐름·AI 협업 면접 신설"}, {"name": "2026 상반기 1차 면접 분석", "type": "학원 분석", "url": "https://www.topbanker-ai.co.kr/board/224274899045-shinhan-2026", "note": "개인안→팀안→전체안, 2025 하반기 복원 주제"}, {"name": "2025 하반기 전형 분석", "type": "학원 분석", "url": "https://www.topbanker-ai.co.kr/board/224054166816-shinhan-2025", "note": "과거 토론·PT·심층 방식"}, {"name": "맥킨지 공식 인터뷰 안내: AI 책임 사용", "type": "공식", "url": "https://www.mckinsey.com/careers/interviewing", "note": "AI 허용 범위·평가 무결성 관련 공식 설명"}, {"name": "맥킨지 AI 케이스 면접 담당자 인터뷰", "type": "기업 담당자 인터뷰", "url": "https://managementconsulted.com/mckinsey-ai-case-interview/", "note": "사례 안에서 AI를 사용하며 비판적 판단·의사소통을 평가"}, {"name": "2026 맥킨지 AI 면접 도입 보도", "type": "언론", "url": "https://www.theguardian.com/business/2026/jan/14/mckinsey-graduates-ai-chatbot-recruitment-consultancy", "note": "내부 AI Lilli로 사례 분석 및 결과 검토 사례"}, {"name": "베인·BCG AI 활용 면접 비교", "type": "민간 분석", "url": "https://managementconsulted.com/ai-case-interview/", "note": "베인의 자료·도구 활용형과 BCG 파일럿 보도; 지역별 차이"}, {"name": "2026 KB국민은행 AI 리터러시 분석", "type": "민간 분석", "url": "https://www.topbanker-ai.co.kr/board/224448932521-kb-2026", "note": "약 70분 및 내장 AI 등은 학원 자료의 후기·정리이며 공식 확정 형식이 아님"}, {"name": "2026 AI 채용 동향 고용24 재게시", "type": "채용시장 배경", "url": "https://m.work.go.kr/news/employ/employNewsDetailView.do?newsId=07100501.20260109130456001&wiseAreaCd=N_JOB_J_02", "note": "AI가 지원자를 평가하는 사례와 지원자가 AI를 활용하는 평가의 차이"}]};

function openGroup(id){let x=DB.groups.find(x=>x.id===id),chosen=JSON.parse(notes[id+'_choices']||'[]');openModal(`<span class="badge">가상 시나리오 · 그룹 연습</span><h2>${esc(x.title)}</h2><div class="note"><b>상황자료</b><p>${esc(x.brief)}</p></div><p><b>과제:</b> 다음 8개 선택지 중 최우선 3개를 고르고 개인안을 작성한 뒤 팀 합의안을 발표하세요.</p><div class="options">${x.options.map((o,i)=>`<label class="opt"><input type="checkbox" ${chosen.includes(i)?'checked':''} onchange="setGroupChoice('${id}',${i},this.checked)"><span>${i+1}. ${esc(o)}</span></label>`).join('')}</div><p class="small" id="choiceCount">선택 ${chosen.length}/3개</p><h3>개인 근거 · 다른 팀에 대한 설득 논리 · 절충안</h3>${noteArea(id,'평가기준 3개 → 선정 이유 → 반론 예상 → 양보할 조건 → 최종 팀 결론')}<div class="row"><button class="secondary" onclick="toggleAnswer()">토론 가이드·해설 보기</button><button class="secondary" onclick="startTimer(600)">10분 타이머</button><span class="timer" id="timerview"></span></div><div id="answerbox" class="answer hidden"><h4>예시 평가축</h4><p>${esc(x.criteria)}</p><h4>진행 방식</h4><p>${esc(x.steps)}</p><p>${esc(x.debrief)}</p><h4>팀 발표용 문장 뼈대</h4><p class="quote">저희 팀은 ${esc(x.criteria)}을 종합해 우선순위를 정했습니다. [1순위]는 [고객/은행 효과]가 크고 [실행조건]이 분명하며, [2·3순위]는 [위험 및 보완책]을 전제로 추진하겠습니다. 서로 다른 의견 가운데 [수용한 근거]를 반영해 최종안에 합의했습니다.</p><p class="small muted">정답표가 아니라 근거와 협업 태도를 평가하는 자기점검 기준입니다.</p></div><div class="row">${doneBtn(x.id)}</div>`)}
function setGroupChoice(id,i,checked){let a=JSON.parse(notes[id+'_choices']||'[]');if(checked&&!a.includes(i))a.push(i);else if(!checked)a=a.filter(v=>v!==i);if(a.length>3){alert('3개까지만 선택할 수 있습니다.');document.querySelectorAll('.options input')[i].checked=false;return}notes[id+'_choices']=JSON.stringify(a);store();$('#choiceCount').textContent=`선택 ${a.length}/3개`}
function renderAI(){let typ=['전체','AI 활용형','AI 검증형','AI 협업형'];$('#ai').innerHTML=`<div class="panel"><h2>AI 협업면접 연구 · 실제 사례 기반 훈련</h2><p>신한은행의 실제 AI 협업면접 문항·도구·시간은 미공개입니다. 아래는 <b>다른 기업의 실제 평가 도입 사례</b>와 <b>신한은행을 위한 가상 연습문제</b>를 엄격히 구분해 구성했습니다. 실제 고객자료 대신 가상 자료만 사용하세요.</p><div class="hero-grid"><div class="info"><span class="badge verify">담당자 인터뷰·보도</span><b>맥킨지 · AI 케이스</b>사례 중 AI로 가설·대안을 만들고, 답변을 검증하고, 고객 상황에 맞게 결론을 개선. <a href="https://managementconsulted.com/mckinsey-ai-case-interview/" target="_blank" rel="noopener">근거</a></div><div class="info"><span class="badge">민간 분석·후기</span><b>베인·BCG · 자료 기반 사례</b>문서·스프레드시트·AI를 활용해 권고안을 도출하고 발표/질의응답. 지역·시기별 차이 있음. <a href="https://managementconsulted.com/ai-case-interview/" target="_blank" rel="noopener">근거</a></div><div class="info"><span class="badge warn">학원 분석</span><b>KB국민은행 · AI 리터러시</b>AI 도구를 통한 문제해결·판단·윤리 점검; 구체적인 문항수·시간은 공식 확정 아님. <a href="https://www.topbanker-ai.co.kr/board/224448932521-kb-2026" target="_blank" rel="noopener">근거</a></div></div></div>${aiCasesMarkup()}<div class="panel"><h3>그래서 무엇을 연습할까?</h3><div class="hero-grid"><div class="info"><b>① AI 활용형</b>목표·자료범위·형식 명시, 수치와 출처를 갖춘 초안 생성</div><div class="info"><b>② AI 검증형</b>계산·회계기준·근거·보안·과도한 결론 반박</div><div class="info"><b>③ AI 협업형</b>재질문·반론·대안 → 최종 권고안·1분 발표</div></div><p class="small muted">팁: 실전 과제에서는 시작 전 직접 가설을 세우고 AI를 보조 수단으로 활용한 뒤, 마지막 판단을 본인의 언어로 설명하세요. 실제 면접에서는 감독자가 허용한 도구와 자료만 사용해야 합니다.</p></div><div class="panel"><h2>AI 협업면접 미션 <span class="badge">${DB.ai.length}세트</span></h2><p>기존 20개 과제에 <b>타기업 실사례에서 파생한 수치·자료 기반 실전 미션 ${DB.ai.length-20}개</b>를 추가했습니다. 모든 과제는 자체 제작한 가상 문제입니다. 초안·검토·수정·최종 판단을 작성하고 해설과 비교해 보세요.</p><div class="toolbar"><select id="aiType" onchange="filterAI()">${typ.map(x=>`<option>${x}</option>`).join('')}</select><input id="aiSearch" placeholder="미션 검색 · 맥킨지 / 베인 / KB / 회계" oninput="filterAI()"><button class="secondary" onclick="openAI(DB.ai[Math.floor(Math.random()*DB.ai.length)].id)">랜덤 미션</button></div><div class="cards" id="aiList"></div></div>`;filterAI()}
function filterAI(){let typ=$('#aiType').value,v=$('#aiSearch').value.toLowerCase();$('#aiList').innerHTML=DB.ai.filter(x=>(typ==='전체'||x.type===typ)&&(x.title+x.task).toLowerCase().includes(v)).map(x=>`<article class="tile"><span class="badge">${esc(x.type)}</span><h3>${esc(x.title)}</h3><p>${esc(x.task)}</p><footer><button class="primary" onclick="openAI('${x.id}')">미션 수행</button>${doneBtn(x.id)}</footer></article>`).join('')}
function openAI(id){let x=DB.ai.find(x=>x.id===id);openModal(`<span class="badge">${esc(x.type)} · 가상 연습</span><h2>${esc(x.title)}</h2><div class="note"><b>미션</b><p>${esc(x.task)}</p></div><h3>내 프롬프트 / 검증 메모 / 수정 결과</h3><p class="small muted">① 첫 판단 → ② AI 활용·결과 → ③ 검산·반론 → ④ 수정 요청 → ⑤ 최종 권고(확신도·한계 포함)</p>${noteArea(id,'1차 프롬프트 → AI가 한 주장 → 내가 확인한 오류/출처 → 수정 지시 → 최종 판단')}<div class="row"><button class="secondary" onclick="toggleAnswer()">모범 접근법 보기</button><button class="secondary" onclick="startTimer(480)">8분 타이머</button><span class="timer" id="timerview"></span></div><div id="answerbox" class="answer hidden"><h4>검증·해결 포인트</h4><p>${esc(x.guide)}</p><h4>권장 협업 절차</h4><p>${esc(x.workflow)}</p><h4>재사용 가능한 프롬프트 틀</h4><p class="quote">당신은 은행 실무자의 분석 보조자입니다. 아래 제공된 가상 자료만 사용하세요. ① 계산식과 근거 ② 확인된 사실·가정·미확인 사항 ③ 위험 요인과 반론 ④ 추가 필요한 자료 ⑤ 표 형식의 결론을 구분하세요. 추정값과 외부 출처를 만들어내지 마세요. 최종 승인 여부는 결정하지 마세요.</p></div><div class="note"><b>자기점검 5개</b><p>문제 재정의 · 사실/가정 분리 · 수치 검산 · AI 답변 반박 · 최종 의사결정 근거</p></div><div class="row">${doneBtn(x.id)}</div>`)}
function renderMock(){let sets=Array.from({length:12},(_,i)=>({num:i+1,d:DB.questions[(i*5+3)%DB.questions.length],g:DB.groups[(i*7)%DB.groups.length],a:DB.ai[(i*9+2)%DB.ai.length]}));$('#mock').innerHTML=`<div class="panel"><h2>실전 모의면접 세트 <span class="badge">12회</span></h2><p>각 회차는 <b>심층 질문 1개 + 그룹 과제 1개 + AI 미션 1개</b>로 구성됩니다. 연습 권장시간(개별 1분, 그룹 개인안 10분, AI 8분)은 임의 설정이며 실제 면접시간이 아닙니다.</p><div class="cards">${sets.map(s=>`<div class="tile"><span class="badge">ROUND ${String(s.num).padStart(2,'0')}</span><h3>${esc(s.g.title)}</h3><p>심층: ${esc(s.d.q)}</p><p>AI: ${esc(s.a.title)}</p><footer><button class="primary" onclick="openSet(${s.num})">세트 열기</button></footer></div>`).join('')}</div></div>`;window.MOCKSETS=sets}
function openSet(n){let s=window.MOCKSETS.find(s=>s.num===n);openModal(`<span class="badge">모의면접 ${n}회차</span><h2>세 전형 연속 연습</h2><div class="choice"><b>① 심층면접 · 60초</b><p>${esc(s.d.q)}</p><button class="secondary" onclick="openDeep('${s.d.id}')">답변 연습하기</button></div><div class="choice"><b>② 그룹 개인안 · 10분</b><p>${esc(s.g.title)}</p><button class="secondary" onclick="openGroup('${s.g.id}')">자료와 선택지 열기</button></div><div class="choice"><b>③ AI 협업 · 8분</b><p>${esc(s.a.title)}</p><button class="secondary" onclick="openAI('${s.a.id}')">AI 미션 열기</button></div><p class="small muted">혼자 연습할 경우 그룹 단계는 자신의 선택 기준과 반론·절충안을 소리 내어 설명하세요.</p>`)}
function renderReview(){let p=progress(),unfinished=[...DB.questions,...DB.groups,...DB.ai].filter(x=>!completed[x.id]);$('#review').innerHTML=`<div class="panel"><h2>학습 진행 현황</h2><div class="row between"><b>${p.num}/${p.total}개 완료</b><b class="counter">${p.pct}%</b></div><div class="bar"><div class="fill" style="width:${p.pct}%"></div></div><div class="stats" style="margin:20px 0">${[['심층',DB.questions],['그룹',DB.groups],['AI',DB.ai]].map(([label,items])=>`<div class="info"><b>${label}</b><span class="counter">${items.filter(x=>completed[x.id]).length}/${items.length}</span></div>`).join('')}</div><div class="row"><button class="secondary" onclick="downloadNotes()">내 작성내용 JSON 내보내기</button><button class="secondary" onclick="document.getElementById('importfile').click()">복습 데이터 불러오기</button><input type="file" id="importfile" accept="application/json" style="display:none" onchange="importNotes(this)"></div><p class="small muted">저장된 내용은 현재 브라우저·기기에서만 유지됩니다. 파일 백업을 권장합니다.</p></div><div class="panel"><h2>아직 연습하지 않은 문제</h2><p class="muted">완료하지 않은 문제 ${unfinished.length}개 중 최대 30개를 보여줍니다.</p><div class="cards">${unfinished.slice(0,30).map(x=>`<article class="tile"><span class="badge">${x.id[0]==='d'?'심층':x.id[0]==='g'?'그룹':'AI'}</span><h3>${esc(x.q||x.title)}</h3><button class="secondary" onclick="${x.id[0]==='d'?'openDeep':x.id[0]==='g'?'openGroup':'openAI'}('${x.id}')">열기</button></article>`).join('')}</div></div>`}
function renderSources(){$('#sources').innerHTML=`<div class="panel"><h2>출처·후기·분석 구분</h2><div class="note warning">회계사 특별채용 통합면접의 구체적 출제문제, 도구, 시간표, 평가표는 확인되지 않았습니다. 아래 직접 후기 대다수는 일반 신입행원·리더십전형 자료입니다. 자료 기반 과제와 해설은 모두 학습용으로 구성했습니다.</div>${DB.sources.map(s=>`<div class="sourceitem"><span class="badge ${s.type==='공고'?'verify':s.type==='학원 분석'?'warn':''}">${esc(s.type)}</span> <b>${esc(s.name)}</b><p class="small muted">${esc(s.note)}</p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">원문 확인 ↗</a></div>`).join('')}</div><div class="panel"><h2>분석의 신뢰도 규칙</h2><p><b>공식 확인:</b> 모집 직무·통합면접 3종·영상인터뷰 활용. <b>후기:</b> 과거 응시자가 경험한 상품 우선순위·토론·개인 질문. <b>학원 분석:</b> 여러 후기를 모아 해석한 진행순서·경향 수치. <b>자체 모의과제:</b> 실제 신한은행 문제지로 검증되지 않은 연습용 창작 문제.</p></div>`}
function renderAll(){renderOverview();renderDeep();renderGroup();renderAI();renderMock();renderReview();renderSources();showTab(current)}
function openModal(str){$('#modalbody').innerHTML=str;$('#modal').classList.add('open');document.body.style.overflow='hidden';$('#modal').querySelector('.dialog').scrollTop=0;stopTimer()}
function closeModal(){stopTimer();$('#modal').classList.remove('open');document.body.style.overflow=''}
function toggleAnswer(){$('#answerbox')?.classList.toggle('hidden')}
function stopTimer(){if(activeTimer){clearInterval(activeTimer);activeTimer=null}}
function startTimer(seconds){stopTimer();remaining=seconds;let t=$('#timerview');if(!t)return;let show=()=>{t.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`};show();activeTimer=setInterval(()=>{remaining--;show();if(remaining<=0){stopTimer();t.textContent='시간 종료'}},1000)}
function downloadNotes(){let data=JSON.stringify({version:3,completed,notes},null,2),a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.href=url;a.download='shinhan_interview_progress.json';a.click();URL.revokeObjectURL(url)}
function importNotes(el){let f=el.files?.[0];if(!f)return;f.text().then(t=>{try{let d=JSON.parse(t);if(!d.notes||!d.completed)throw Error('유효한 백업 파일이 아닙니다');notes=d.notes;completed=d.completed;store();renderAll();alert('학습기록을 불러왔습니다.')}catch(e){alert('파일을 읽지 못했습니다: '+e.message)}})}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});renderAll();
</script></body></html>
